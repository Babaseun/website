server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    # ── Caching policy ──────────────────────────────────────────────
    # Default: revalidate on every request. nginx sends ETag +
    # Last-Modified automatically, so browsers (and Cloudflare) get
    # cheap 304s and content edits appear on the next reload.
    # Covers the HTML at "/" — the case the old
    # `location = /index.html { expires -1; }` never actually reached.
    expires -1;

    # Heavy assets (architecture PNGs, badges): cache hard for a week.
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
        expires 7d;
    }

    # Health endpoint: no cache headers, no access-log noise.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
        expires off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}