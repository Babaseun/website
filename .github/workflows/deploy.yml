name: Build and push website

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: "website-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-push:
    # The OIDC role is scoped to the main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask AWS account details
        run: |
          registry="${ECR_REPOSITORY_URL%%/*}"
          account_id="${registry%%.dkr.ecr.*}"
          echo "::add-mask::$registry"
          echo "::add-mask::$account_id"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-website-ecr

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REPOSITORY_URL }}:${{ steps.image.outputs.tag }}
            ${{ env.ECR_REPOSITORY_URL }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write image summary
        env:
          IMAGE_REPO: ${{ env.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repo="${IMAGE_REPO#*/}"
          {
            echo "### Image pushed"
            echo ""
            echo "\`${repo}:${IMAGE_TAG}\`"
            echo ""
            echo "Also tagged: \`${repo}:latest\`"
            echo ""
            echo "Digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"